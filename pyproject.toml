[project]
name = "nats-assistant"
version = "0.1.0"
description = "Local backend and core services for NATS Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
google = [
  "google-auth[requests]>=2.38.0,<3",
  "google-auth-oauthlib>=1.2.0,<2",
  "requests>=2.32.0,<3",
]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
nats-assistant = "nats_assistant.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
